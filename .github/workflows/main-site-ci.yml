name: Main site CI

on:
  pull_request:
    paths-ignore:
      - "services/shenxiang-new-api/**"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "services/shenxiang-new-api/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Verify critical coverage
        run: npm run test:coverage:critical

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
