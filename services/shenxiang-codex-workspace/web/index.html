<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星人 Codex</title>
    <link rel="stylesheet" href="/codex/assets/styles.css?v=20260618-artifacts-inline" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="rail" aria-label="Codex 导航">
        <div class="brand">
          <span class="brand-mark agent-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path class="agent-core" d="M24 5.5 39.5 14.5v19L24 42.5 8.5 33.5v-19L24 5.5Z" />
              <path class="agent-line" d="M24 12.5v7.2M15.7 17.3l6.1 3.6M32.3 17.3l-6.1 3.6M17.2 31.2l6.8-3.9 6.8 3.9" />
              <circle class="agent-dot" cx="24" cy="24" r="4.3" />
            </svg>
          </span>
          <div>
            <strong>星人 Codex</strong>
            <span id="accountState">正在同步账户</span>
          </div>
        </div>
        <button id="newChat" class="rail-action" type="button">
          <span aria-hidden="true">+</span>
          <strong>新建会话</strong>
        </button>
        <nav class="rail-nav" aria-label="Codex 功能">
          <button id="navHome" class="nav-item active" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-5H9v5H4v-9.5Z" /></svg>
            <span>首页</span>
          </button>
          <button id="navExplore" class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h9v9h-9V4ZM4 11h5v9H4v-9Zm7 4h9v5h-9v-5ZM4 4h5v5H4V4Z" /></svg>
            <span>探索广场</span>
          </button>
          <button id="navKnowledge" class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5V4Zm9 1.8V9h3.2L14 5.8ZM8 12h8v1.6H8V12Zm0 3.6h8v1.6H8v-1.6Z" /></svg>
            <span>知识库</span>
          </button>
          <button id="navPlugins" class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v4h4v8h-4v6H8v-6H4V7h4V3Zm2 2v4H6v4h4v6h4v-6h4V9h-4V5h-4Z" /></svg>
            <span>插件中心</span>
          </button>
          <button id="navIntegrations" class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7A4.5 4.5 0 0 1 12 2.5h4A4.5 4.5 0 0 1 20.5 7 4.5 4.5 0 0 1 16 11.5h-2v-2h2A2.5 2.5 0 0 0 18.5 7 2.5 2.5 0 0 0 16 4.5h-4A2.5 2.5 0 0 0 9.5 7H7.5Zm2.5 5.5h4v-2h-4A4.5 4.5 0 0 0 5.5 15 4.5 4.5 0 0 0 10 19.5h4a4.5 4.5 0 0 0 4.5-4.5h-2A2.5 2.5 0 0 1 14 17.5h-4A2.5 2.5 0 0 1 7.5 15 2.5 2.5 0 0 1 10 12.5Z" /></svg>
            <span>第三方接入</span>
          </button>
        </nav>
        <section class="rail-section skill-dock" aria-label="已安装 Skill">
          <div class="rail-section-head">
            <h2>已安装 Skill</h2>
            <span id="skillCount">0</span>
          </div>
          <div id="installedSkillList" class="installed-skill-list">
            <p>登录后自动同步</p>
          </div>
        </section>
        <section class="rail-section compact">
          <h2>自动配置</h2>
          <p>API Key、模型和额度会从 New API 登录态同步。用户打开页面后即可开始会话。</p>
          <a class="ghost-button rail-link" href="/" aria-label="返回 API 主站">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.2 5.2 4.4 12l6.8 6.8 1.4-1.4L8.2 13H20v-2H8.2l4.4-4.4-1.4-1.4Z" /></svg>
            返回 API 主站
          </a>
          <button id="openSkillModal" class="ghost-button" type="button">创建插件</button>
        </section>
      </aside>

      <section class="chat-shell" aria-label="Codex 会话">
        <header class="topbar">
          <div class="title-block">
            <p class="eyebrow">Codex Workspace</p>
            <h1>云端 Codex 会话</h1>
            <p class="title-subtitle">自动同步账户、额度、模型与社区 Skill</p>
          </div>
          <div id="balanceState" class="balance-pill">余额同步中</div>
          <div class="top-controls">
            <label>
              <span>模型</span>
              <select id="modelSelect"></select>
            </label>
            <div class="model-chip" id="modelChip">自动匹配任务类型</div>
            <label>
              <span>Skill</span>
              <select id="skillSelect"></select>
            </label>
          </div>
        </header>

        <div id="notice" class="notice">打开页面后会自动同步 New API 账户，并匹配可用模型。</div>
        <section class="mode-console" aria-label="模型模式与计费">
          <div class="mode-tabs" role="tablist" aria-label="任务模式">
            <button type="button" class="active" data-mode="codex" role="tab" aria-selected="true">对话 / 代码</button>
            <button type="button" data-mode="claude" role="tab" aria-selected="false">Claude 高阶</button>
            <button type="button" data-mode="image" role="tab" aria-selected="false">图像生成</button>
            <button type="button" data-mode="video" role="tab" aria-selected="false">视频生成</button>
          </div>
          <div class="mode-copy">
            <strong id="modeTitle">对话 / 代码</strong>
            <span id="modeDescription">普通对话、代码审查、文件分析和 Skill 工作区。</span>
          </div>
          <div id="billingHint" class="billing-hint">按文本 Token 计费，适合日常任务和代码任务。</div>
        </section>

        <section id="messages" class="messages" aria-live="polite"></section>

        <div id="eventStream" class="event-stream" aria-label="运行事件"></div>

        <footer class="composer">
          <div id="fileList" class="file-list"></div>
          <div class="input-row composer-panel">
            <label id="dropZone" class="upload-button" title="上传文件或图片" aria-label="上传文件或图片">
              <input id="fileInput" type="file" multiple />
              <span class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M12 5v10m0-10 4 4m-4-4-4 4" />
                  <path d="M5 15.5v2.2c0 .7.6 1.3 1.3 1.3h11.4c.7 0 1.3-.6 1.3-1.3v-2.2" />
                </svg>
              </span>
              <span class="upload-label">上传</span>
              <span class="upload-hint">拖入</span>
            </label>
            <input id="maskFileInput" type="file" accept="image/png" hidden />
            <div class="composer-body">
              <textarea id="taskInput" rows="3" placeholder="给 Codex 发消息，Enter 发送，Shift + Enter 换行"></textarea>
              <div class="composer-tools">
                <button id="composerAttach" class="tool-chip" type="button">关联文件</button>
                <button id="maskAttach" class="tool-chip mask-tool" type="button">上传蒙版 PNG</button>
                <button class="tool-chip" type="button" data-prompt="请根据下面代码做审查，并给出风险、修改建议和最终版本。">插入代码</button>
                <button class="tool-chip" type="button" data-prompt="请把我的需求拆成目标、步骤、风险和验收清单。">快捷指令</button>
                <button class="tool-chip" type="button" data-prompt="请作为专业 Codex 智能体处理这个任务，先澄清目标，再给出可执行方案。">智能体</button>
              </div>
            </div>
            <div class="send-group">
              <button id="runTask" class="send-button" type="button">
                <span aria-hidden="true">➤</span>
                发送
              </button>
              <button class="send-menu" type="button" title="发送选项">⌄</button>
            </div>
          </div>
        </footer>
      </section>
    </main>

    <dialog id="skillModal" class="skill-modal">
      <form method="dialog" class="skill-form">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Community Skill</p>
            <h2>创建社区 Skill</h2>
          </div>
          <button id="closeSkillModal" class="icon-button" value="cancel">×</button>
        </div>
        <label>
          <span>Skill 名称</span>
          <input id="skillName" placeholder="writing_director" />
        </label>
        <label>
          <span>展示说明</span>
          <input id="skillDesc" placeholder="例如：按固定结构输出高质量方案" />
        </label>
        <label class="skill-upload">
          <span>上传 SKILL.md</span>
          <input id="skillFileInput" type="file" accept=".md,.markdown,text/markdown,text/plain" />
          <strong>选择 Markdown 文件</strong>
          <small id="skillFileStatus">支持 .md / .markdown，会自动读取 name 和 description。</small>
        </label>
        <label>
          <span>SKILL.md 规则</span>
          <textarea id="skillContent" rows="11" placeholder="写清楚这个 Skill 的目标、步骤、边界和输出格式"></textarea>
        </label>
        <label class="agreement">
          <input id="skillAgreement" type="checkbox" />
          <span>我同意：我创建的 Skill 属于社区共享型，会公开展示给所有用户使用；不得包含违法、侵权、泄密、删除文件或破坏系统的内容。</span>
        </label>
        <div class="modal-actions">
          <button id="createSkill" class="primary-button" type="button">安装并提交审核</button>
        </div>
      </form>
    </dialog>

    <script src="/codex/assets/app.js?v=20260618-artifacts-inline"></script>
  </body>
</html>
