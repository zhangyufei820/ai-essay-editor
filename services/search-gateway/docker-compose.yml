services:
  app:
    build: .
    image: shenxiang-search-gateway:latest
    container_name: shenxiang-search-gateway
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    ports:
      - "127.0.0.1:${HOST_PORT:-8014}:8000"
    networks:
      default:
      shenxiang-net:
        aliases:
          - search-gateway

networks:
  shenxiang-net:
    external: true
