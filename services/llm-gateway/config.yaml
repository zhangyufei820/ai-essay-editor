      extra_headers: *managed_new_api_headers
      timeout: 18
    model_info:
      id: deploy-new-api-gpt-5-5
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  - model_name: sx-general-text
    litellm_params:
      model: openai/gpt-5.4-mini
      api_base: os.environ/SHENXIANG_NEW_API_BASE_URL
      api_key: os.environ/SHENXIANG_NEW_API_TEXT_API_KEY
      extra_headers: *managed_new_api_headers
      timeout: 20
    model_info:
      id: deploy-new-api-gpt-5-4-mini
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  # Multimodal chat/recognition uses the independently evaluated VecoAI route.
  # Long-running image generation stays on the durable media task gateways.
  - model_name: sx-image-vision
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: os.environ/VECOAI_LLM_BASE_URL
      api_key: os.environ/VECOAI_LLM_API_KEY
      timeout: 20
    model_info:
      id: deploy-vecoai-gemini-3-8-flash
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  # Stable internal aliases retained for existing Dify workflow references.
  - model_name: sx-claude-sonnet-4-6
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: os.environ/SHENXIANG_NEW_API_BASE_URL
