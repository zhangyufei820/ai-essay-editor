router_settings:
  fallbacks:
    - sx-fast-chat: ["sx-gpt-5.5-vivaapi", "sx-gpt-5.5-moonapix", "sx-gemini-3.1-pro"]
    - sx-chinese-text: ["sx-claude-opus-4-7-vivaapi", "sx-claude-sonnet-4-6", "sx-claude-sonnet-4-6-moonapix", "sx-general-text"]
    - sx-math-text: ["sx-gpt-5.5-vivaapi", "sx-gpt-5.5-moonapix", "sx-gemini-3.1-pro"]
    - sx-general-text: ["sx-gpt-5.5-vivaapi", "sx-gpt-5.5-moonapix", "sx-gemini-3.1-pro"]
    - gpt-5.2: ["sx-gpt-5.2-vivaapi"]
    - gpt-5.4: ["sx-gpt-5.4-vivaapi", "sx-gpt-5.4-moonapix"]
    - gpt-5.4-mini: ["sx-gpt-5.4-mini-vivaapi", "sx-gpt-5.4-mini-moonapix"]
    - gpt-5.4-pro: ["sx-gpt-5.4-pro-vivaapi", "gpt-5.4"]
    - gpt-5.5: ["sx-gpt-5.5-vivaapi", "sx-gpt-5.5-moonapix", "sx-gemini-3.1-pro"]
    - claude-opus-4-7: ["sx-claude-opus-4-7-vivaapi", "sx-claude-sonnet-4-6"]
    - claude-sonnet-4-6: ["sx-claude-sonnet-4-6-moonapix"]
  routing_strategy: simple-shuffle
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 1
  retry_after: 1
  timeout: 25

litellm_settings:
  request_timeout: 25
  num_retries: 1
  drop_params: true
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
