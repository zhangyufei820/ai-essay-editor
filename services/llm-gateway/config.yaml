model_list:
  # Business aliases. Keep clients on these names so provider/model changes can
  # happen inside the gateway without touching Dify or frontend config.
  #
  # Primary providers and fallback order are based on production smoke probes on
  # 2026-06-01. Public model names keep one fastest primary deployment; slower
  # same-model deployments are exposed as sx-* fallback aliases.
  - model_name: sx-fast-chat
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/TOKENFLUX_LLM_BASE_URL
      api_key: os.environ/TOKENFLUX_LLM_API_KEY
      extra_headers:
        User-Agent: Codex
      timeout: 20

  - model_name: sx-chinese-text
    litellm_params:
      model: openai/claude-opus-4-7
      api_base: os.environ/MOONAPIX_LLM_BASE_URL
      api_key: os.environ/MOONAPIX_LLM_API_KEY
      timeout: 40

  - model_name: sx-math-text
    litellm_params:
      model: openai/gpt-5.5
