router_settings:
  fallbacks:
    - sx-fast-chat: ["sx-gpt-5.5-vivaapi", "sx-gemini-3.1-pro"]
    - sx-chinese-text: ["sx-claude-sonnet-4-6", "sx-claude-opus-4-6-thinking", "sx-general-text"]
    - sx-math-text: ["sx-gpt-5.5-vivaapi", "sx-gemini-3.1-pro"]
    - sx-general-text: ["sx-gpt-5.5-vivaapi", "sx-gemini-3.1-pro"]
  routing_strategy: latency-based-routing
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 1
  retry_after: 1
  timeout: 25

litellm_settings:
  request_timeout: 25
  num_retries: 1
  drop_params: true
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
