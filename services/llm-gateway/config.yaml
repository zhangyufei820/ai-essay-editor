model_list:
  # Production policy (2026-08-12): every shenxiang.school text/vision alias
  # has one New API primary deployment. Explicit fallback aliases are Viva-only.
  # Provider credentials are injected from .env.production and never committed.
  - model_name: sx-fast-chat
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/SHENXIANG_NEW_API_BASE_URL
      api_key: os.environ/SHENXIANG_NEW_API_TEXT_API_KEY
      extra_headers: &managed_new_api_headers
        User-Agent: shenxiang-llm-gateway/1.0
      timeout: 18
    model_info:
      id: deploy-new-api-gpt-5-5
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  - model_name: sx-chinese-text
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: os.environ/SHENXIANG_NEW_API_BASE_URL
      api_key: os.environ/SHENXIANG_NEW_API_CLAUDE_API_KEY
      extra_headers: *managed_new_api_headers
      timeout: 30
    model_info:
      id: deploy-new-api-claude-sonnet-4-6
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  - model_name: sx-math-text
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/SHENXIANG_NEW_API_BASE_URL
