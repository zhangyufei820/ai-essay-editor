model_list:
  - model_name: sx-fast-chat
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: os.environ/LLM_PROVIDER_A_BASE_URL
      api_key: os.environ/LLM_PROVIDER_A_API_KEY
      timeout: 20

  - model_name: sx-fast-chat
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: os.environ/LLM_PROVIDER_B_BASE_URL
      api_key: os.environ/LLM_PROVIDER_B_API_KEY
      timeout: 20

  - model_name: sx-fast-chat
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: os.environ/LLM_PROVIDER_C_BASE_URL
      api_key: os.environ/LLM_PROVIDER_C_API_KEY
      timeout: 20

router_settings:
  routing_strategy: latency-based-routing
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 1
  retry_after: 1
  timeout: 25

litellm_settings:
  request_timeout: 25
  num_retries: 1
  drop_params: true
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
