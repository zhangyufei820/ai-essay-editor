guardrails:
  - guardrail_name: sx-global-sensitive-content
    litellm_params:
      guardrail: litellm_content_filter
      mode: ["pre_call", "post_call"]
      default_on: true
      blocked_words_file: /app/guardrails/blocked-words.yaml
      categories:
        - category: harmful_illegal_weapons
          action: BLOCK
          severity_threshold: medium

router_settings:
  fallbacks:
    - sx-fast-chat: ["fallback-vecoai-gemini-3-6-flash"]
    - sx-super-agent: ["fallback-vecoai-gemini-3-8-flash"]
    - sx-chinese-text: ["fallback-vecoai-gemini-3-6-flash"]
    - sx-math-text: ["fallback-vecoai-gemini-3-8-flash"]
    - sx-general-text: ["fallback-vecoai-gemini-3-6-flash"]
    - sx-image-vision: ["fallback-new-api-gpt-5-6-sol-vision", "fallback-vecoai-gemini-3-6-flash", "fallback-vecoai-gemini-3-7-flash"]
    - sx-claude-sonnet-4-6: ["fallback-vecoai-gemini-3-8-flash"]
    - sx-claude-opus-4-6-thinking: ["fallback-vecoai-gemini-3-8-flash"]
    - sx-gemini-3.1-pro: ["fallback-vecoai-gemini-3-8-flash"]
    - gpt-4o-mini: ["fallback-vecoai-gemini-3-6-flash"]
    - gpt-5.2: ["fallback-vecoai-gemini-3-8-flash"]
    - gpt-5.3: ["fallback-vecoai-gemini-3-8-flash"]
    - gpt-5.3-spark: ["fallback-vecoai-gemini-3-6-flash"]
    - gpt-5.4: ["fallback-vecoai-gemini-3-8-flash"]
    - gpt-5.4-mini: ["fallback-vecoai-gemini-3-6-flash"]
    - gpt-5.4-pro: ["fallback-vecoai-gemini-3-8-flash"]
    - gpt-5.5: ["fallback-vecoai-gemini-3-8-flash"]
    - claude-opus-4-7: ["fallback-vecoai-gemini-3-8-flash"]
    - claude-sonnet-4-6: ["fallback-vecoai-gemini-3-8-flash"]
    - claude-3-7-sonnet-20250219: ["fallback-vecoai-gemini-3-8-flash"]
    - claude-sonnet-4-6-thinking: ["fallback-vecoai-gemini-3-8-flash"]
    - claude-opus-4-6-thinking: ["fallback-vecoai-gemini-3-8-flash"]
    - gemini-3.1-flash-lite-preview: ["fallback-vecoai-gemini-3-6-flash"]
    - gemini-3-pro-image-preview: ["fallback-vecoai-gemini-3-pro-image-preview"]
    - gemini-3.1-pro-preview: ["fallback-vecoai-gemini-3-8-flash"]
    - gemini-2.5-flash: ["fallback-vecoai-gemini-3-6-flash"]
    - gemini-2.5-pro: ["fallback-vecoai-gemini-3-8-flash"]
    - grok-4.2: ["fallback-vecoai-gemini-3-8-flash"]
  routing_strategy: latency-based-routing
  routing_strategy_args:
    ttl: 30
    lowest_latency_buffer: 0
  allowed_fails: 1
  cooldown_time: 45
  num_retries: 0
  retry_after: 0
  timeout: 22
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 1
    RateLimitErrorAllowedFails: 1
    BadRequestErrorAllowedFails: 0
    InternalServerErrorAllowedFails: 1

litellm_settings:
  request_timeout: 22
  num_retries: 0
  drop_params: true
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  background_health_checks: true
  health_check_interval: 180
  health_check_concurrency: 1
  health_check_skip_disabled_background_models: true
  enable_health_check_routing: true
  health_check_staleness_threshold: 360
  health_check_ignore_transient_errors: false
  health_check_details: false
