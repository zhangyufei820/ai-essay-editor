      timeout: 20
    model_info:
      id: deploy-new-api-gpt-5-4-mini
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  # Multimodal chat/recognition; long-running image generation stays on the
  # durable image task gateways and follows the same New API -> Viva policy.
  - model_name: sx-image-vision
    litellm_params:
      model: openai/gpt-5.4-mini
