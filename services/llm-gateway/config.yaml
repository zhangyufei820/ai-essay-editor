model_list:
  # Business aliases. Keep clients on these names so provider/model changes can
  # happen inside the gateway without touching Dify or frontend config.
  #
  # The hot aliases below are single-primary routes. Fast failover happens
  # through explicit router fallbacks so the request path stays deterministic:
  # primary first, then the next healthy fallback deployment.
  - model_name: sx-fast-chat
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/TOKENFLUX_LLM_BASE_URL
      api_key: os.environ/TOKENFLUX_LLM_API_KEY
      extra_headers:
        User-Agent: Codex Desktop/0.133.0 (Mac OS 13.5.0; x86_64) Apple_Terminal/447 (codex_exec; 0.133.0)
      timeout: 25
    model_info:
      id: deploy-tokenflux-gpt-5-5
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  - model_name: sx-chinese-text
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: os.environ/MOONAPIX_LLM_BASE_URL
      api_key: os.environ/MOONAPIX_LLM_API_KEY
      timeout: 30
    model_info:
      id: deploy-moonapix-claude-sonnet-4-6
      mode: chat
      health_check_timeout: 8
      health_check_max_tokens: 3

  - model_name: sx-math-text
