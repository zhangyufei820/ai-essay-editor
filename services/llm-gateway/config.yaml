guardrails:
  - guardrail_name: sx-global-sensitive-content
    litellm_params:
      guardrail: litellm_content_filter
      mode: ["pre_call", "post_call"]
      default_on: true
      blocked_words_file: /app/guardrails/blocked-words.yaml
      categories:
        - category: harmful_illegal_weapons
          action: BLOCK
          severity_threshold: medium

router_settings:
  fallbacks:
    - sx-fast-chat: ["fallback-viva-gpt-5.5"]
    - sx-chinese-text: ["fallback-viva-claude-sonnet-4-6"]
    - sx-math-text: ["fallback-viva-gpt-5.5"]
    - sx-general-text: ["fallback-viva-gpt-5.4-mini"]
    - sx-image-vision: ["fallback-viva-gpt-5.4-mini"]
    - sx-claude-sonnet-4-6: ["fallback-viva-claude-sonnet-4-6"]
    - sx-claude-opus-4-6-thinking: ["fallback-viva-claude-opus-4-6-thinking"]
    - sx-gemini-3.1-pro: ["fallback-viva-gemini-3.1-pro-preview"]
    - gpt-4o-mini: ["fallback-viva-gpt-4o-mini"]
    - gpt-5.2: ["fallback-viva-gpt-5.2"]
    - gpt-5.3: ["fallback-viva-gpt-5.5"]
    - gpt-5.3-spark: ["fallback-viva-gpt-5.5"]
    - gpt-5.4: ["fallback-viva-gpt-5.4"]
    - gpt-5.4-mini: ["fallback-viva-gpt-5.4-mini"]
    - gpt-5.4-pro: ["fallback-viva-gpt-5.4-pro"]
    - gpt-5.5: ["fallback-viva-gpt-5.5"]
    - claude-opus-4-7: ["fallback-viva-claude-opus-4-7"]
    - claude-sonnet-4-6: ["fallback-viva-claude-sonnet-4-6"]
    - claude-3-7-sonnet-20250219: ["fallback-viva-claude-sonnet-4-6"]
    - claude-sonnet-4-6-thinking: ["fallback-viva-claude-sonnet-4-6-thinking"]
    - claude-opus-4-6-thinking: ["fallback-viva-claude-opus-4-6-thinking"]
    - gemini-3.1-flash-lite-preview: ["fallback-viva-gemini-2.5-flash"]
    - gemini-3-pro-image-preview: ["fallback-viva-gemini-3-pro-image-preview"]
    - gemini-3.1-pro-preview: ["fallback-viva-gemini-3.1-pro-preview"]
    - gemini-2.5-flash: ["fallback-viva-gemini-2.5-flash"]
    - gemini-2.5-pro: ["fallback-viva-gemini-2.5-pro"]
    - grok-4.2: ["fallback-viva-grok-4.2"]
  routing_strategy: latency-based-routing
  routing_strategy_args:
    ttl: 30
    lowest_latency_buffer: 0
  allowed_fails: 1
  cooldown_time: 45
  num_retries: 0
  retry_after: 0
  timeout: 22
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 1
    RateLimitErrorAllowedFails: 1
    BadRequestErrorAllowedFails: 0
    InternalServerErrorAllowedFails: 1

litellm_settings:
  request_timeout: 22
  num_retries: 0
  drop_params: true
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  background_health_checks: true
  health_check_interval: 180
  health_check_concurrency: 1
  health_check_skip_disabled_background_models: true
  enable_health_check_routing: true
  health_check_staleness_threshold: 360
  health_check_ignore_transient_errors: false
  health_check_details: false
